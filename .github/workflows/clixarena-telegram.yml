name: CLIXARENA video encode and Telegram 4GB upload
run-name: CLIXARENA TG · ${{ inputs.output_name }} · ${{ inputs.job_id || inputs.subtitle_path }}
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Direct HTTPS video URL (inputs are visible to repository users)
        required: true
        type: string
      output_name:
        description: Video filename (with or without .mp4)
        required: true
        default: CLIXARENA.mp4
        type: string
      overlay_layout:
        description: Preview layout JSON (set by portal; blank uses defaults)
        type: string
        required: false
      overlay_name:
        description: Separate title shown in video (blank uses filename)
        type: string
        required: false
      runner_mode:
        description: Single runner (direct, fast, no chunk transfer) or Parallel (4 runners)
        required: false
        default: parallel
        type: choice
        options:
          - single
          - parallel
      subtitle_method:
        description: Burn, selected-language on/off subtitles, or MP4 upload without added subtitles
        required: true
        type: choice
        default: burn
        options:
          - burn
          - soft
          - transfer
      sample_only:
        description: Encode first 3 minutes for preview (no host upload)
        required: true
        default: false
        type: boolean
      subtitle_path:
        description: auto picks the only SRT uploaded to subtitles/ (any filename), or enter its path
        default: auto
        required: true
        type: string
      font_path:
        description: Font TTF/OTF path in fonts/ or system:noto-sinhala / system:dejavu-sans / system:dejavu-serif
        default: fonts/IskoolaPota.ttf
        required: true
        type: string
      quality:
        description: Telegram dedicated quality is fixed to 720p - Balanced
        required: true
        default: 720p - Balanced
        type: choice
        options:
          - 720p - Balanced
      crf:
        description: CRF 0-51 (lower = higher quality/larger file); auto uses High 18 or Balanced 23
        required: true
        default: 'auto'
        type: string
      audio_track:
        description: auto, zero-based track number (0, 1...), or language code (eng, hin...)
        required: true
        default: auto
        type: string
      tmdb_url:
        description: TMDB movie/TV URL for English original logo (blank disables title overlay)
        required: false
        type: string
      title_animation:
        description: Enable title animation
        type: boolean
        default: true
        required: true
      show_logo:
        description: Show English title logo (requires TMDB URL)
        type: boolean
        default: true
        required: true
      show_name:
        description: Show output name
        type: boolean
        default: true
        required: true
      show_message:
        description: Show Sinhala message
        type: boolean
        default: true
        required: true
      overlay_start:
        description: Title animation start (seconds or HH:MM:SS)
        required: true
        default: '5'
        type: string
      overlay_duration:
        description: Title animation duration in seconds (4 to 60)
        required: true
        default: '8'
        type: string
      source_commit:
        description: Uploaded subtitle commit (set automatically by the Vercel page)
        required: false
        type: string
      job_id:
        description: Portal tracking ID (set automatically by the Vercel page)
        required: false
        type: string
permissions:
  contents: write
  pull-requests: none
  issues: none
  packages: none
  id-token: none
concurrency:
  group: clixarena-telegram-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  encode:
    name: Download, audio selection and preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      distributed: ${{ steps.video.outputs.distributed }}
      matrix: ${{ steps.video.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1

      - name: Setup static FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "Installing static FFmpeg..."
            curl -sL --connect-timeout 15 --max-time 120 https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe 2>/dev/null || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography requests

      - name: Setup python tools
        run: |
          if ! python3 -c "import libtorrent" 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-libtorrent
          fi

      - name: Download, validate and encode (or prepare chunks)
        id: video
        env:
          RUNNER_MODE: ${{ fromJSON(inputs.overlay_layout || '{}').runnerMode || inputs.runner_mode || 'parallel' }}
          DISTRIBUTED_PREPARE: 'false'
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
          VIDEO_URL: ${{ inputs.video_url }}
          OVERLAY_LAYOUT: ${{ inputs.overlay_layout }}
          OVERLAY_NAME: ${{ inputs.overlay_name }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          SUBTITLE_METHOD: ${{ inputs.subtitle_method }}
          SAMPLE_ONLY: ${{ inputs.sample_only }}
          SUBTITLE_PATH: ${{ inputs.subtitle_path }}
          FONT_PATH: ${{ inputs.font_path }}
          CRF: ${{ inputs.crf }}
          QUALITY: ${{ inputs.quality }}
          PORTAL_JOB_ID: ${{ inputs.job_id }}
          AUDIO_TRACK: ${{ inputs.audio_track }}
          TMDB_URL: ${{ inputs.tmdb_url }}
          TITLE_ANIMATION: ${{ inputs.title_animation }}
          SHOW_LOGO: ${{ inputs.show_logo }}
          SHOW_NAME: ${{ inputs.show_name }}
          SHOW_MESSAGE: ${{ inputs.show_message }}
          OVERLAY_START: ${{ inputs.overlay_start }}
          OVERLAY_DURATION: ${{ inputs.overlay_duration }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # In single runner mode, sample_only flag prevents Abyss upload inside clixarena_video so Telegram step can handle it
          ABYSS_API_KEY: "dummy-for-single-runner"
        run: |
          python3 -u -c '
          import os, sys, json
          sys.path.insert(0, os.path.abspath("scripts"))
          runner_mode = os.getenv("RUNNER_MODE", "parallel")
          layout = json.loads(os.getenv("OVERLAY_LAYOUT", "") or "{}")
          # Enforce quality to 720p - Balanced
          os.environ["QUALITY"] = "720p - Balanced"
          if runner_mode == "single":
              # Intercept to skip abyss upload and preserve clixarena.mp4
              layout["sample_only"] = True
              os.environ["OVERLAY_LAYOUT"] = json.dumps(layout)
          import clixarena_video
          rc = clixarena_video.main()
          if rc != 0:
              sys.exit(rc)
          '

      - name: Start Local Telegram Bot API Server (Single Runner mode)
        if: ${{ steps.video.outputs.distributed != 'true' && !inputs.sample_only }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          mkdir -p /tmp/tg-bot-api-data
          docker run -d \
            --name tg-local-api \
            -p 8081:8081 \
            -v /tmp/tg-bot-api-data:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID="${TG_API_ID}" \
            -e TELEGRAM_API_HASH="${TG_API_HASH}" \
            aiogram/telegram-bot-api:latest \
            --local --dir=/var/lib/telegram-bot-api --temp-dir=/tmp
          
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8081 >/dev/null 2>&1; then
              echo "Local Telegram Bot API is ready on port 8081"
              break
            fi
            sleep 1
          done

      - name: Upload 4GB Single File to Telegram (Single Runner mode)
        if: ${{ steps.video.outputs.distributed != 'true' && !inputs.sample_only }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_LOCAL_API_URL: "http://127.0.0.1:8081"
          OUTPUT_NAME: ${{ inputs.output_name }}
          OVERLAY_LAYOUT: ${{ inputs.overlay_layout }}
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/clixarena_tg_upload.py

      - name: Stop Local Telegram Bot API Server
        if: ${{ always() && steps.video.outputs.distributed != 'true' }}
        run: docker rm -f tg-local-api 2>/dev/null || true

      - name: Stage source chunks concurrently
        if: ${{ steps.video.outputs.distributed == 'true' }}
        uses: ./.github/actions/parallel-source-upload
        with:
          matrix: ${{ steps.video.outputs.matrix }}

      - name: Stage encoding manifest
        if: ${{ steps.video.outputs.distributed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parallel-manifest
          path: parallel-media/manifest.json
          retention-days: 1
          if-no-files-found: error

      - name: Stage burn fonts and artwork
        if: ${{ steps.video.outputs.distributed == 'true' && inputs.subtitle_method == 'burn' }}
        uses: actions/upload-artifact@v4
        with:
          name: parallel-assets
          path: parallel-media/assets/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Stage source audio/subtitle for parallel companion
        if: ${{ steps.video.outputs.distributed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parallel-companion-source
          path: |
            parallel-media/ready.txt
            parallel-media/companion-source.mkv
            parallel-media/audio-source.mka
            parallel-media/subtitle.srt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Stage FFmpeg binaries for workers and finalize
        if: ${{ steps.video.outputs.distributed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parallel-ffmpeg
          path: |
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Saved video mapping receipt
        if: ${{ always() && !inputs.sample_only }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIXARENA-telegram-mapping
          path: mapping-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Downloadable sample
        if: ${{ inputs.sample_only && success() && steps.video.outputs.distributed != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIXARENA-sample
          path: preview/sample.mp4
          if-no-files-found: error
          retention-days: 3

  chunks:
    name: Encode chunk ${{ matrix.chunk }} of four
    needs: encode
    if: ${{ needs.encode.outputs.distributed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.encode.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
      - name: Download FFmpeg from stage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-ffmpeg
          path: /usr/local/bin
      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            curl -sL --connect-timeout 15 --max-time 120 https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || true
          fi
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: parallel-source-${{ matrix.chunk }}
          path: parallel-media
      - uses: actions/download-artifact@v4
        with:
          name: parallel-manifest
          path: parallel-media
      - uses: actions/download-artifact@v4
        if: ${{ inputs.subtitle_method == 'burn' }}
        with:
          name: parallel-assets
          path: parallel-media/assets
      - name: Encode and validate this chunk
        run: python3 -u scripts/clixarena_distributed.py worker --index '${{ matrix.chunk }}'
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-encoded-${{ matrix.chunk }}
          path: |
            parallel-media/encoded-*.mp4
            parallel-media/encoded-*.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  companion:
    name: Prepare audio alongside video workers
    needs: encode
    if: ${{ needs.encode.outputs.distributed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
      - name: Download FFmpeg from stage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-ffmpeg
          path: /usr/local/bin
      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            curl -sL --connect-timeout 15 --max-time 120 https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || true
          fi
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: parallel-manifest
          path: parallel-media
      - uses: actions/download-artifact@v4
        with:
          name: parallel-companion-source
          path: parallel-media
      - name: Prepare and validate AAC companion
        run: python3 -u scripts/clixarena_distributed.py companion
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-companion
          path: |
            parallel-media/ready.txt
            parallel-media/companion.mkv
            parallel-media/audio.m4a
            parallel-media/subtitle.srt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  finalize:
    name: Join, validate and upload MP4 to Telegram (4GB)
    needs: [encode, chunks, companion]
    if: ${{ success() && needs.encode.outputs.distributed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography requests
      - name: Download FFmpeg from stage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-ffmpeg
          path: /usr/local/bin
      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            curl -sL --connect-timeout 15 --max-time 120 https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || true
          fi
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          pattern: parallel-encoded-*
          merge-multiple: true
          path: parallel-media
      - uses: actions/download-artifact@v4
        with:
          name: parallel-companion
          path: parallel-media
      - uses: actions/download-artifact@v4
        with:
          name: parallel-manifest
          path: parallel-media

      - name: Join encoded chunks (skip Abyss upload)
        env:
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
          OVERLAY_LAYOUT: ${{ inputs.overlay_layout }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          # Force sample_only to true during merge so clixarena_distributed produces clixarena.mp4 without calling complete_upload
          SAMPLE_ONLY: "true"
          SUBTITLE_PATH: ${{ inputs.subtitle_path }}
          PORTAL_JOB_ID: ${{ inputs.job_id }}
          ABYSS_API_KEY: "dummy-key-for-local-step"
        run: python3 -u scripts/clixarena_distributed.py merge

      - name: Start Local Telegram Bot API Server
        if: ${{ !inputs.sample_only }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          mkdir -p /tmp/tg-bot-api-data
          docker run -d \
            --name tg-local-api \
            -p 8081:8081 \
            -v /tmp/tg-bot-api-data:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID="${TG_API_ID}" \
            -e TELEGRAM_API_HASH="${TG_API_HASH}" \
            aiogram/telegram-bot-api:latest \
            --local --dir=/var/lib/telegram-bot-api --temp-dir=/tmp
          
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8081 >/dev/null 2>&1; then
              echo "Local Telegram Bot API is ready on port 8081"
              break
            fi
            sleep 1
          done

      - name: Upload 4GB Single File to Private Telegram Channel
        if: ${{ !inputs.sample_only }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_LOCAL_API_URL: "http://127.0.0.1:8081"
          OUTPUT_NAME: ${{ inputs.output_name }}
          OVERLAY_LAYOUT: ${{ inputs.overlay_layout }}
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/clixarena_tg_upload.py

      - name: Stop Local Telegram Bot API Server
        if: always()
        run: docker rm -f tg-local-api 2>/dev/null || true

      - name: Mapping receipt
        if: ${{ always() && !inputs.sample_only }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIXARENA-telegram-mapping
          path: mapping-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Sample MP4
        if: ${{ success() && inputs.sample_only }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIXARENA-sample
          path: preview/sample.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Subtitle companion
        if: ${{ success() && inputs.subtitle_method == 'soft' }}
        uses: actions/upload-artifact@v4
        with:
          name: CLIXARENA-subtitle
          path: preview/subtitle.srt
          if-no-files-found: error
          retention-days: 3
