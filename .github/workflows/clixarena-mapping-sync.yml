name: Sync Abyss mappings
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clixarena-mapping-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Sync Abyss mappings safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING_GITHUB_TOKEN: ${{ secrets.MAPPING_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEY }}
          ABYSS_AUTH_TOKEN: ${{ secrets.ABYSS_AUTH_TOKEN }}
          ABYSS_EMAIL: ${{ secrets.ABYSS_EMAIL }}
          ABYSS_PASSWORD: ${{ secrets.ABYSS_PASSWORD }}
        run: python3 -u scripts/clixarena_mapping_sync.py
