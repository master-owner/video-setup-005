name: CLIXARENA recover merge and upload
run-name: Recover video run ${{ inputs.source_run_id }}
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed run ID (number after /actions/runs/ in its URL)
        required: true
        type: string
      overlay_layout:
        description: Optional original layout JSON override; blank restores from source logs
        required: false
        type: string
      output_name:
        description: Optional output filename override; blank restores original filename
        required: false
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: clixarena-recover-${{ inputs.source_run_id }}
  cancel-in-progress: false
jobs:
  recover:
    name: Reuse encoded artifacts, join intro and upload
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read source run and restore settings
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_LAYOUT: ${{ inputs.overlay_layout }}
          RECOVERY_OUTPUT_NAME: ${{ inputs.output_name }}
        run: python3 -u scripts/clixarena_recover.py prepare
      - name: Install merge tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-cryptography
      - name: Download already encoded chunks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: parallel-encoded-*
          merge-multiple: true
          path: parallel-media
      - name: Download completed audio, subtitles and intro
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: parallel-companion
          path: parallel-media
      - name: Download original manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: parallel-manifest
          path: parallel-media
      - name: Merge, validate, intro and selected host upload
        env:
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEY }}
          OK_PUBLIC_KEY: ${{ secrets.OK_PUBLIC_KEY }}
          OK_SECRET_KEY: ${{ secrets.OK_SECRET_KEY }}
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          STREAMHG_API_KEY: ${{ secrets.STREAMHG_API_KEY }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
        run: python3 -u scripts/clixarena_recover.py merge
      - name: Mapping receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CLIXARENA-recovered-mapping
          path: mapping-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Sample if original run was a sample
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CLIXARENA-recovered-sample
          path: preview/sample.mp4
          if-no-files-found: ignore
          retention-days: 3
